<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3s Preloader</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* Full page loader */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loader {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #3498db;
      border-radius: 50%;
      width: 90px;
      height: 90px;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      margin-top: 15px;
      font-size: 18px;
      color: #555;
    }

    /* Animate dots */
    .dots::after {
      content: '';
      animation: dots 1.5s steps(3, end) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }
  </style>
</head>
<body>
  <!-- Preloader -->
  <div id="preloader">
    <div class="loader"></div>
    <p class="loading-text">Tagad Hangkaraih..<span class="dots"></span></p>
  </div>

  <!-- Main Content -->
  <div id="content" style="display:none;">
    <h1>Welcome to the Website 🚀</h1>
    <p>The preloader disappeared after 3 seconds.</p>
  </div>

  <script>
    // Wait 3 seconds then hide preloader
    setTimeout(() => {
      window.location.href="../system/user.html"
      //document.getElementById("preloader").style.display = "none";
      //document.getElementById("content").style.display = "block";
    }, 3000);
  </script>
</body>
</html>
