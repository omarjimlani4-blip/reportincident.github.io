<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert Center</title>

<style>

/* =========================
   MAIN PAGE
========================= */

body {
    margin:0;

    font-family:"Segoe UI",sans-serif;

    background:
        linear-gradient(
            135deg,
            #dbeafe,
            #e0f2fe,
            #eef2ff
        );

    color:#334155;

    overflow-x:hidden;

    min-height:100vh;

    position:relative;
}


/* Animated background */

body::before,
body::after {
    content:"";

    position:fixed;

    border-radius:50%;

    pointer-events:none;

    z-index:-1;
}

body::before {
    width:360px;
    height:360px;

    background:rgba(37,99,235,.12);

    top:-130px;
    left:-110px;

    animation:
        floatOne 8s ease-in-out infinite;
}

body::after {
    width:420px;
    height:420px;

    background:rgba(14,165,233,.10);

    bottom:-170px;
    right:-130px;

    animation:
        floatTwo 10s ease-in-out infinite;
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:1200px;

    margin:auto;

    padding:20px;
}


/* =========================
   HEADER
========================= */

header{
    text-align:center;

    margin-bottom:20px;

    margin-top:25px;

    animation:
        headerEntrance .8s ease-out;
}

header h1{

    font-size:1.6rem;

    color:#173b6c;

    animation:
        glow 2s infinite alternate;
}

@keyframes glow{

    from{
        text-shadow:
            0 0 5px rgba(37,99,235,.15);
    }

    to{
        text-shadow:
            0 0 20px rgba(37,99,235,.35);
    }

}


/* =========================
   BACK BUTTON
========================= */

header button {

    background:
        linear-gradient(
            135deg,
            #1e5aa8,
            #2563eb
        );

    color:#fff;

    float:left;

    margin-top:-50px;

    margin-left:170px;

    padding:10px 18px;

    border:none;

    border-radius:10px;

    box-shadow:
        0 8px 18px rgba(30,90,168,.20);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;

    cursor:pointer;
}

header button:hover{

    background:
        linear-gradient(
            135deg,
            #174783,
            #1d4ed8
        );

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 12px 25px rgba(30,90,168,.30);
}


/* =========================
   CARD
========================= */

.card{

    background:
        rgba(255,255,255,.90);

    backdrop-filter:
        blur(14px);

    padding:20px;

    border-radius:18px;

    margin-bottom:20px;

    box-shadow:
        0 15px 40px rgba(30,64,175,.12),
        0 4px 12px rgba(0,0,0,.05);

    border:
        1px solid rgba(255,255,255,.8);

    animation:
        slideUp .7s ease forwards;

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.card:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 20px 45px rgba(30,64,175,.16);
}

.card h2{

    color:#173b6c;

    margin-top:0;

    margin-bottom:15px;
}


/* =========================
   CARD ANIMATION
========================= */

@keyframes slideUp{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   INPUTS
========================= */

input,
textarea,
select,
button{

    padding:12px;

    border-radius:9px;

    border:none;

    font-size:1rem;
}

input{

    border:
        1px solid #d1d5db;

    background:#f8fafc;

    color:#1e293b;

    outline:none;

    transition:
        border-color .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
}

input:focus{

    border-color:#2563eb;

    background:#fff;

    transform:
        translateY(-2px);

    box-shadow:
        0 0 0 3px rgba(37,99,235,.10),
        0 6px 15px rgba(37,99,235,.10);
}

textarea{

    resize:vertical;
}


/* =========================
   TABLE
========================= */

table{

    width:100%;

    border-collapse:collapse;

    margin-top:10px;

    background:
        rgba(255,255,255,.75);

    backdrop-filter:
        blur(10px);

    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 8px 25px rgba(30,64,175,.08);

    animation:
        tableEntrance .8s ease-out;
}


/* Table Header */

th{

    padding:14px;

    text-align:left;

    background:
        linear-gradient(
            135deg,
            #173b6c,
            #1e5aa8
        );

    color:#fff;

    font-size:.9rem;

    letter-spacing:.2px;
}


/* Table Data */

td{

    padding:13px;

    text-align:left;

    color:#334155;

    border-bottom:
        1px solid #e2e8f0;

    background:
        rgba(255,255,255,.72);

    transition:
        background .25s ease,
        transform .25s ease;
}


/* Row hover */

tr:hover td{

    background:
        #eff6ff;
}


/* =========================
   REPLY BUTTON
========================= */

.reply-btn{

    background:
        linear-gradient(
            135deg,
            #00a843,
            #00c853
        );

    color:#fff;

    border:none;

    padding:7px 13px;

    border-radius:7px;

    cursor:pointer;

    box-shadow:
        0 5px 12px rgba(0,200,83,.18);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.reply-btn:hover{

    transform:
        translateY(-2px)
        scale(1.04);

    box-shadow:
        0 8px 18px rgba(0,200,83,.25);
}


/* =========================
   DELETE BUTTON
========================= */

.delete-btn{

    background:
        linear-gradient(
            135deg,
            #c62828,
            #ef4444
        );

    color:#fff;

    border:none;

    padding:7px 13px;

    border-radius:7px;

    cursor:pointer;

    box-shadow:
        0 5px 12px rgba(211,47,47,.18);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.delete-btn:hover{

    transform:
        translateY(-2px)
        scale(1.04);

    box-shadow:
        0 8px 18px rgba(211,47,47,.25);
}


/* =========================
   TABLE ANIMATION
========================= */

@keyframes tableEntrance{

    from{
        opacity:0;
        transform:scale(.98);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}


/* =========================
   BACKGROUND ANIMATION
========================= */

@keyframes floatOne{

    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(40px,25px);
    }

}

@keyframes floatTwo{

    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(-35px,-25px);
    }

}


@keyframes headerEntrance{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .container{
        padding:15px;
    }

    header h1{
        font-size:1.35rem;
    }

    header button{

        float:none;

        margin:
            0 auto 15px auto;

        display:block;
    }

    .card{
        padding:15px;

        overflow-x:auto;
    }

    table{

        min-width:850px;
    }

}

</style>
</head>
<body>

<header>
    <h1>Report Center</h1>
    <button class="back" onclick="location.href='dashboard.html'">Back to Dashboard</button>
</header>

<div class="container">

    <!-- ALERT TABLE -->
    <div class="card">
        <h2>Incoming Reports</h2>
        <table>
            <thead>
                <tr>
                    <th>Guard Name</th>
                    <th>Post</th>
                    <th>Date / Time</th>
                    <th>Alert</th>
                    <th>Reply</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="alertTable"></tbody>
        </table>
    </div>

</div>

<script>
// Load alerts from localStorage (populated by Guard Panel)
let alerts = JSON.parse(localStorage.getItem("alertsData")) || [];

// Render alert table
function renderTable(){
    const table = document.getElementById("alertTable");
    table.innerHTML = "";
    alerts.forEach((a,index)=>{
        table.innerHTML += `
            <tr>
                <td>${a.guardName}</td>
                <td>${a.post}</td>
                <td>${a.dateTime}</td>
                <td>${a.alertMsg}</td>
                <td>
                    <input type="text" id="reply_${index}" placeholder="Type reply" value="${a.reply || ''}">
                    <button class="reply-btn" onclick="sendReply(${index})">Send</button>
                </td>
                <td><button class="delete-btn" onclick="deleteAlert(${index})">Delete</button></td>
            </tr>
        `;
    });
}

// Send reply to guard
function sendReply(index){
    const replyText = document.getElementById(`reply_${index}`).value;
    alerts[index].reply = replyText;
    localStorage.setItem("alertsData", JSON.stringify(alerts));
    renderTable();
}

// Delete alert
function deleteAlert(index){
    if(confirm("Are you sure you want to delete this alert?")){
        alerts.splice(index,1);
        localStorage.setItem("alertsData", JSON.stringify(alerts));
        renderTable();
    }
}

// Initial render
renderTable();
</script>

</body>
</html>
