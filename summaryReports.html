<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incident Summary Report</title>

<style>

/* =========================
   MAIN DESIGN
========================= */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:"Segoe UI",sans-serif;

    background:
        linear-gradient(
            135deg,
            #dbeafe,
            #e0f2fe,
            #eef2ff
        );

    color:#334155;

    overflow-x:hidden;

    min-height:100vh;

    position:relative;
}


/* Animated background circles */

body::before,
body::after{

    content:"";

    position:fixed;

    border-radius:50%;

    pointer-events:none;

    z-index:-1;
}

body::before{

    width:380px;

    height:380px;

    background:
        rgba(37,99,235,.10);

    top:-150px;

    left:-120px;

    animation:
        floatOne 8s ease-in-out infinite;
}

body::after{

    width:430px;

    height:430px;

    background:
        rgba(14,165,233,.09);

    right:-150px;

    bottom:-170px;

    animation:
        floatTwo 10s ease-in-out infinite;
}


/* =========================
   CONTAINER
========================= */

.container{

    max-width:1200px;

    margin:auto;

    padding:20px;

    animation:
        pageEntrance .8s ease-out;
}


/* =========================
   HEADER
========================= */

header{

    text-align:center;

    margin-bottom:25px;

    position:relative;

    animation:
        headerEntrance .8s ease-out;
}

header h1{

    color:#173b6c;

    font-size:1.8rem;

    margin:10px 0 25px;

    animation:
        glow 2s infinite alternate;
}

@keyframes glow{

    from{
        text-shadow:
            0 0 5px rgba(37,99,235,.15);
    }

    to{
        text-shadow:
            0 0 22px rgba(37,99,235,.35);
    }

}


/* =========================
   CARD
========================= */

.card{

    background:
        rgba(255,255,255,.90);

    backdrop-filter:
        blur(14px);

    padding:22px;

    border-radius:18px;

    margin-bottom:20px;

    box-shadow:
        0 15px 40px rgba(30,64,175,.12),
        0 4px 12px rgba(0,0,0,.05);

    border:
        1px solid rgba(255,255,255,.8);

    animation:
        slideUp .7s ease forwards;

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.card:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 20px 45px rgba(30,64,175,.16);
}


/* =========================
   BUTTONS
========================= */

button{

    padding:9px 15px;

    border:none;

    border-radius:9px;

    cursor:pointer;

    font-size:.95rem;

    font-weight:600;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

button:hover{

    transform:
        translateY(-2px)
        scale(1.03);
}


/* Back Button */

.back{

    position:absolute;

    right:0;

    top:0;

    background:
        linear-gradient(
            135deg,
            #1e5aa8,
            #2563eb
        );

    color:white;

    padding:10px 20px;

    border-radius:25px;

    box-shadow:
        0 8px 18px rgba(30,90,168,.20);
}

.back:hover{

    background:
        linear-gradient(
            135deg,
            #174783,
            #1d4ed8
        );

    box-shadow:
        0 12px 25px rgba(30,90,168,.30);
}


/* Print Button */

.print-btn{

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #22c55e
        );

    color:#fff;

    margin-bottom:15px;

    padding:10px 18px;

    box-shadow:
        0 7px 15px rgba(22,163,74,.18);
}

.print-btn:hover{

    background:
        linear-gradient(
            135deg,
            #15803d,
            #16a34a
        );

    box-shadow:
        0 10px 20px rgba(22,163,74,.25);
}


/* Delete Button */

.delete-btn{

    background:
        linear-gradient(
            135deg,
            #dc2626,
            #ef4444
        );

    color:#fff;

    padding:7px 13px;

    box-shadow:
        0 5px 12px rgba(220,38,38,.15);
}

.delete-btn:hover{

    background:
        linear-gradient(
            135deg,
            #b91c1c,
            #dc2626
        );
}


/* =========================
   TABLE
========================= */

table{

    width:100%;

    border-collapse:collapse;

    margin-top:10px;

    background:
        rgba(255,255,255,.78);

    backdrop-filter:
        blur(10px);

    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 8px 25px rgba(30,64,175,.08);

    animation:
        tableEntrance .8s ease-out;
}


/* Header */

th{

    padding:14px;

    text-align:left;

    background:
        linear-gradient(
            135deg,
            #173b6c,
            #1e5aa8
        );

    color:#fff;

    font-size:.9rem;

    letter-spacing:.2px;
}


/* Cells */

td{

    padding:13px;

    text-align:left;

    color:#334155;

    border-bottom:
        1px solid #e2e8f0;

    background:
        rgba(255,255,255,.72);

    transition:
        background .25s ease,
        transform .25s ease;
}


/* Hover */

tr:hover td{

    background:
        #eff6ff;
}


/* =========================
   EMPTY TABLE MESSAGE
========================= */

td[colspan="6"]{

    color:#64748b;

    padding:25px;

    font-weight:500;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes pageEntrance{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

@keyframes headerEntrance{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes slideUp{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes tableEntrance{

    from{
        opacity:0;
        transform:scale(.98);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

@keyframes floatOne{

    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(40px,25px);
    }

}

@keyframes floatTwo{

    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(-35px,-25px);
    }

}


/* =========================
   PRINT DESIGN
========================= */

@media print{

    body{

        background:#fff;

        color:#000;
    }

    body::before,
    body::after{

        display:none;
    }

    .card{

        background:#fff;

        box-shadow:none;

        border:none;
    }

    .back{

        display:none;
    }

    .print-btn{

        display:none;
    }

    th{

        background:#173b6c !important;

        color:#fff !important;
    }

    td{

        color:#000;

        background:#fff;
    }

    .delete-btn{

        display:none;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .container{

        padding:15px;
    }

    header h1{

        font-size:1.4rem;

        margin-top:5px;

        padding-top:45px;
    }

    .back{

        position:absolute;

        top:0;

        right:0;

        padding:8px 14px;

        font-size:.85rem;
    }

    .card{

        padding:15px;

        overflow-x:auto;
    }

    table{

        min-width:850px;
    }

}

</style>
</head>

<body>

<div class="container">

<header>

    <h1>Incident Summary Report</h1>

    <button class="back" onclick="location.href='dashboard.html'">
        Back to Dashboard
    </button>

</header>

<div class="card">

    <button class="print-btn" onclick="printReport()">
        🖨 Print Report
    </button>

    <table>

        <thead>

            <tr>
                <th>Responder's Name</th>
                <th>Location</th>
                <th>Date/Time</th>
                <th>Alert Message</th>
                <th>Reply</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="incidentTable"></tbody>

    </table>

</div>

</div>

<script>

let alerts = JSON.parse(localStorage.getItem("alertsData")) || [];

function renderTable(){
    const table = document.getElementById("incidentTable");
    table.innerHTML = "";
    if(alerts.length === 0){
        table.innerHTML = `<tr><td colspan="6" style="text-align:center;">No incidents reported.</td></tr>`;
        return;
    }
    alerts.forEach((a,index)=>{
        table.innerHTML += `<tr>
            <td>${a.guardName}</td>
            <td>${a.post}</td>
            <td>${a.dateTime}</td>
            <td>${a.alertMsg}</td>
            <td>${a.reply || "-"}</td>
            <td>
                <button class="delete-btn" onclick="deleteAlert(${index})">Delete</button>
            </td>
        </tr>`;
    });
}

function deleteAlert(index){
    if(confirm("Are you sure you want to delete this alert?")){
        alerts.splice(index,1);
        localStorage.setItem("alertsData", JSON.stringify(alerts));
        renderTable();
    }
}

function printReport(){
    let originalContent = document.body.innerHTML;
    let reportContent = document.querySelector(".container").innerHTML;
    document.body.innerHTML = reportContent;
    window.print();
    document.body.innerHTML = originalContent;
    renderTable(); // re-render after print
}

// Initial render
renderTable();

</script>

</body>
</html>
